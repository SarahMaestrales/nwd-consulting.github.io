- q: In which countries do you have consultants?
  a: NWD currently has connections in Australia, Brazil, Italy, Kenya, Malaysia, Nigeria, Peru, Portugal, Spain, South Africa, and the United States of America.
- q: What is NWD Consulting Network?
  a: We are individual consultants from countries around the world. We each have our own services and expertise which we bring to the group, uniting on having experience in navigating cultural differences in major collaborations.
- q: What inspired NWD Consulting Network?
  a: One afternoon, founders Sarah Maestrales, Ph.D. and Ifeyinwa Anugom, Ph.D., LMSW were discussing their experiences navigating international research collaborations. When Ife titled her insights "When my American training just wasn't enough," the two realized they were likely not alone in wishing they had received more training regarding customs and cultural differences before making their research plans. The two decided to organize, pool their services, and unite under their mutual love of research and cultural appreciation.
- q: What does NWD stand for?
  a: N. Wilson Dittbenner, a family name.
- q: Is there a flat consulting fee?
  a: No. Our prices vary by service and consultant based on the nature of the job, country of origin, and services provided. In some instances, consultants have even bartered for services.
- q: Can I just send you my data?
  a: No. Due to international data regulations, you may only send our consultants de-identified data sets. We can take care of the other details, but no identifying information can be transmitted to our consultants.
- q: How do I join NWD Consulting Network?
  a: To join our network of consultants, you must be a registered consultant who is legally able to work in your country of residence; you must have experience in navigating international and/or intercultural exchanges in professional settings; and you must have demonstrated exceptional experience and knowledge in your field.
- q: Who can benefit from NWD Consulting Network services?
  a: Anyone doing business or research. Each of our consultants brings a unique skill set to the table in addition to their familiarity with international collaboration. Students who are preparing their dissertation work can consult with research methodologists or psychometricians, learning system designers can speak with EdTech specialists, and curriculum designers can speak with learning experts. We even have an AI strategist on board.
