{% extends "base.html" %}
{% from "macros.html" import post_item %}
{% block content %}
<header class="page-head">
  <div class="wrap">
    <p class="crumb"><a href="/blog/">Get the latest</a></p>
    <h1>{{ 'Category' if kind == 'category' else 'Tag' }}: {{ term.name }}</h1>
  </div>
</header>
<section class="section section-flush">
  <div class="wrap">
    <div class="post-list">
      {% for p in posts %}{{ post_item(p) }}{% endfor %}
    </div>
  </div>
</section>
{% endblock %}
